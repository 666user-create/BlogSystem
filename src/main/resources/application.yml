server:
  port: 8080

blog:
  jwt:
    # JWT 签名密钥（Base64 编码的 HMAC-SHA 密钥）
    # 生产环境务必通过环境变量 BLOG_JWT_SECRET 覆盖，不要使用默认值
    secret: ${BLOG_JWT_SECRET:dVnsmy+SIX6pNptQdeclDSJ26EMSPEIhvZYKBTTug4k=}
    # token 过期时间（毫秒），默认 24 小时
    expiration: 86400000

spring:
  profiles:
    active: "@profile.name@"

  # 静态资源（前端 HTML/CSS/JS）每次请求都向服务器校验是否变更：
  # 未变更返回 304（开销极小），已变更立即拿到新文件。
  # 这样可避免"新 HTML + 浏览器缓存的旧 CSS"导致的样式错乱（曾踩坑：卡片样式整体失效）。
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/java_blog_spring?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-test-query: SELECT 1
      validation-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  file:
    # 日志统一收进 logs/ 目录，避免污染项目根目录（Spring Boot 会自动创建该目录）
    name: logs/spring-blog-dev.log
