[pytest]
# 测试用例文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出：-v 显示每个用例名，-ra 显示失败摘要
# Allure 原始结果统一收到 tests/reports/ 下（生成物，已 gitignore）
addopts = -v -ra --alluredir=../reports/allure-results --clean-alluredir

# 单个用例超时保护（需要 pytest-timeout，未装则忽略）
# timeout = 60
