# 测试环境专用配置
# ============================================================
# 说明：
#   @SpringBootTest 接口测试通过 @ActiveProfiles("test") 激活本配置，
#   只覆盖"测试需要覆盖"的属性（如数据库密码），其余继承 application.yml。
#
#   为什么需要这个文件：
#   - 主配置 application.yml 默认激活 prod profile，
#     而 application-prod.yml 中的数据库密码在部分环境下已过期/不适用；
#   - 测试不应依赖/修改开发、生产配置，因此用独立的 test profile 固定测试数据库连接。
# ============================================================
spring:
  datasource:
    # 本机 MySQL root 密码（如果与你的环境不同，请改成你自己的密码）
    password: root
