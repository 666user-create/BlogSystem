server:
  port: 8081

spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        # 组件一(注册中心): 服务启动后到 Nacos 报到, 名字为 user-service
        server-addr: 127.0.0.1:8848
        # Nacos 未启动时仅告警不阻断启动(默认 fail-fast 会导致注册失败直接启动失败)
        fail-fast: false
      config:
        # 组件一(配置中心): 从 Nacos 拉取 user-service.yaml 覆盖本文件
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    # optional: 表示 Nacos 没启动/没有该配置也不报错, 使用本文件的值兜底
    import: optional:nacos:user-service.yaml
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/blog_cloud?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

blog:
  jwt:
    # 网关/用户服务/博客服务必须使用同一个密钥
    secret: ${BLOG_JWT_SECRET:dVnsmy+SIX6pNptQdeclDSJ26EMSPEIhvZYKBTTug4k=}
    expiration: 86400000

# ===== 配置中心演示 =====
# 本地兜底值。在 Nacos 控制台修改 user-service.yaml 里的 app.switch-on 后,
# 访问 /user/configInfo 可看到热更新效果(无需重启服务)。
# 注意: 用 open/closed 而不用 on/off —— YAML 1.1 会把 on/off 解析成布尔值
app:
  switch-on: open

# ===== 组件五: Seata 分布式事务 =====
# 默认关闭: 不影响基本流程。启动 Seata Server 后, 把 enabled 改为 true 即可演示
# 博客服务发博客 -> 博客服务写 blog_info + Feign 调本服务增加 blog_count, 要么全成功要么全回滚
seata:
  enabled: false
  application-id: user-service
  tx-service-group: blog_tx_group
  registry:
    type: file
  service:
    vgroup-mapping:
      blog_tx_group: default
    grouplist:
      default: 127.0.0.1:8091

logging:
  level:
    com.example.blogcloud: info
