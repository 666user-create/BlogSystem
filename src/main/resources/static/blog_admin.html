<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客管理</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="">
        <span class="blog-title">我的博客系统</span>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_edit.html">写博客</a>
        <a class="nav-span nav-admin" href="blog_admin.html">管理</a>
        <a class="nav-span" href="#" onclick="logout()">注销</a>
    </div>

    <div class="admin-container">
        <div class="admin-header">
            <h2>博客管理</h2>
            <span class="admin-badge">管理员</span>
        </div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th style="width:60px">ID</th>
                        <th>标题</th>
                        <th style="width:140px">创建时间</th>
                        <th style="width:80px">状态</th>
                        <th style="width:100px">操作</th>
                    </tr>
                </thead>
                <tbody id="blog-tbody">
                    <tr><td colspan="5" class="loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pager" id="pager" style="display:none">
            <span class="pager-info">共 <b id="pager-total">0</b> 篇 · 第 <b id="pager-current">0</b>/<b id="pager-pages">0</b> 页</span>
            <button type="button" id="pager-prev" onclick="changePage(-1)">上一页</button>
            <button type="button" id="pager-next" onclick="changePage(1)">下一页</button>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        // ===== 分页状态 =====
        var PAGE_SIZE = 10;    // 每页条数（后端限制最大 50）
        var currentPage = 1;   // 当前页码
        var totalPages = 0;    // 总页数（以后端返回为准）

        $(function () {
            // 非 admin 用户拦截
            var userName = sessionStorage.getItem("userName") || "";
            if (userName !== "admin") {
                alert("无管理员权限");
                location.href = "blog_list.html";
                return;
            }
            loadAdminList(1);
        });

        /**
         * 分页加载博客列表（含下架）
         * @param pageNum 页码（从 1 开始）
         */
        function loadAdminList(pageNum) {
            $.ajax({
                type: "get",
                url: "/blog/adminList",
                data: { pageNum: pageNum, pageSize: PAGE_SIZE },
                success: function (result) {
                    if (!result || result.code !== 200 || !result.data) {
                        $("#blog-tbody").html('<tr><td colspan="5">' + ((result && result.errMsg) || "加载失败") + '</td></tr>');
                        renderPager(0, 0, 0);
                        return;
                    }
                    var pageData = result.data;
                    currentPage = pageData.pageNum || 1;
                    totalPages = pageData.pages || 0;
                    renderTable(pageData.list || []);
                    renderPager(pageData.total, currentPage, totalPages);
                },
                error: function () {
                    $("#blog-tbody").html('<tr><td colspan="5">加载失败，请稍后重试</td></tr>');
                    renderPager(0, 0, 0);
                }
            });
        }

        function renderTable(list) {
            if (list.length === 0) {
                // 区分"没有任何博客"和"页码越界"
                var emptyText = (currentPage > 1) ? "这一页没有内容了，请返回上一页" : "暂无博客";
                $("#blog-tbody").html('<tr><td colspan="5" class="empty">' + emptyText + '</td></tr>');
                return;
            }
            var html = "";
            for (var i = 0; i < list.length; i++) {
                var blog = list[i];
                var isPublished = blog.publishedStatus === 1;
                var statusClass = isPublished ? "status-on" : "status-off";
                var statusText = isPublished ? "上架" : "下架";
                var btnText = isPublished ? "下架" : "上架";
                var btnClass = isPublished ? "btn-off" : "btn-on";
                var createTime = blog.createTime || "";

                html += '<tr>';
                html += '<td>' + blog.id + '</td>';
                html += '<td class="title-cell">' + escapeHtml(blog.title || "") + '</td>';
                html += '<td>' + createTime + '</td>';
                html += '<td><span class="' + statusClass + '">' + statusText + '</span></td>';
                html += '<td><button class="' + btnClass + '" onclick="togglePublish(' + blog.id + ',this)">' + btnText + '</button></td>';
                html += '</tr>';
            }
            $("#blog-tbody").html(html);
        }

        /** 渲染翻页控件 */
        function renderPager(total, pageNum, pages) {
            var $pager = $("#pager");
            if (!$pager.length) return;

            $pager.find("#pager-total").text(total || 0);
            $pager.find("#pager-current").text(pages > 0 ? pageNum : 0);
            $pager.find("#pager-pages").text(pages || 0);
            $pager.find("#pager-prev").prop("disabled", !(pages > 0 && pageNum > 1));
            $pager.find("#pager-next").prop("disabled", !(pages > 0 && pageNum < pages));
            $pager.toggle(pages > 1);
        }

        /** 翻页：delta 为 -1（上一页）或 1（下一页） */
        function changePage(delta) {
            var target = currentPage + delta;
            if (target < 1) return;
            if (totalPages > 0 && target > totalPages) return;
            loadAdminList(target);
        }

        function togglePublish(blogId, btn) {
            if (!confirm("确定切换该博客的上下架状态吗？")) return;
            $.ajax({
                type: "post",
                url: "/blog/togglePublish",
                data: { blogId: blogId },
                success: function (result) {
                    if (result && result.code === 200) {
                        // 切换后刷新"当前页"，保留页码
                        loadAdminList(currentPage);
                    } else {
                        alert(result && result.errMsg ? result.errMsg : "操作失败");
                    }
                },
                error: function () {
                    alert("操作失败，请稍后重试");
                }
            });
        }

        function escapeHtml(str) {
            var div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>

</html>
