<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客详情页</title>

    <link rel="stylesheet" href="css/common.css?v=20260913">
    <link rel="stylesheet" href="css/detail.css?v=20260913">

</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="" onerror="this.onerror=null;this.src='pic/site-bg.png'">
        <span class="blog-title">我的博客系统</span>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_edit.html">写博客</a>
        <a class="nav-span nav-admin" href="blog_admin.html">管理</a>
        <a class="nav-span" href="#" onclick="logout()">注销</a>
    </div>

    <div class="container">
        <div class="left">
            <div class="card">
                <h3></h3>
                <a href="#">GitHub 地址</a>
                <div class="row">
                    <span>文章</span>
                    <span>分类</span>
                </div>
                <div class="row">
                    <span id="user-blog-count">0</span>
                    <span>1</span>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="content">
                <div class="title"></div>
                <div class="date"></div>
                <div class="author"></div>
                <div class="detail"></div>
                <!-- 编辑/删除仅作者本人可见：默认隐藏，由 JS 判断当前登录用户是否为作者后再显示 -->
                <div class="operating" style="display:none">
                    <button onclick="toUpdate()">编辑</button>
                    <button onclick="deleteBlog()">删除</button>
                </div>
            </div>

        </div>
    </div>

    <!-- 引入 editor.md 的依赖 -->
    <link rel="stylesheet" href="blog-editormd/css/editormd.css" />
    <script src="js/jquery.min.js"></script>
    <script src="blog-editormd/lib/marked.min.js"></script>
    <script src="blog-editormd/lib/prettify.min.js"></script>
    <script src="blog-editormd/editormd.js"></script>
    <script src="js/common.js?v=20260913"></script>
    <script>
        // 从 URL 中获取 blogId
        var params = new URLSearchParams(location.search);
        var blogId = params.get("blogId");

        /**
         * 渲染前消毒（BUG-11：博客正文未做 XSS 过滤）
         * 博客正文是 Markdown，允许夹带原始 HTML；若直接 innerHTML 会执行脚本，形成存储型 XSS。
         * 这里做"只删危险内容"的清理，保留正常标签（<strong>、<br>、<table>…），不影响 Markdown 渲染：
         *   1) 删除 script / iframe / object / embed / link / style / form / base / meta
         *   2) 删除所有以 on 开头的事件属性（onerror / onclick / onload …）
         *   3) 删除 href / src 中以 javascript: 开头的值
         */
        function sanitizeHtml(html) {
            var $wrap = $("<div>").html(html);
            $wrap.find("script,iframe,object,embed,link,style,form,base,meta").remove();
            $wrap.find("*").addBack().each(function () {
                if (!this.attributes) {
                    return;
                }
                Array.prototype.slice.call(this.attributes).forEach(function (attr) {
                    var name = attr.name.toLowerCase();
                    var value = (attr.value || "").trim().toLowerCase();
                    if (name.indexOf("on") === 0) {
                        this.removeAttribute(attr.name);
                    } else if ((name === "href" || name === "src" || name === "xlink:href")
                            && value.indexOf("javascript:") === 0) {
                        this.removeAttribute(attr.name);
                    }
                }, this);
            });
            return $wrap.html();
        }

        if (!blogId) {
            alert("缺少博客ID");
        } else {
            // 加载博客详情
            $.ajax({
                type: "get",
                url: "/blog/getBlogDetail",
                data: { blogId: blogId },
                success: function (result) {
                    if (result && result.code === 200 && result.data) {
                        $(".content .title").text(result.data.title || "");
                        $(".content .date").text(result.data.createTime || "");
                        // 详情页展示完整内容：内容是 Markdown，需要渲染成 HTML
                        // （此前用 .text() 直接塞纯文本，导致 ## 标题、**加粗** 等语法原样显示）
                        var raw = result.data.content || "";
                        var html;
                        if (typeof marked === "function") {
                            html = marked(raw);              // editor.md 自带的 marked(0.3.x)：函数式调用
                        } else if (window.marked && typeof window.marked.parse === "function") {
                            html = window.marked.parse(raw); // 新版 marked：对象式调用
                        } else {
                            html = $("<div>").text(raw).html();  // 兜底：转义后按纯文本展示
                        }
                        // BUG-11 修复：Markdown 里可以夹带原始 HTML，直接 innerHTML 会执行
                        // <script>、<img onerror> 这类脚本（存储型 XSS）。插入页面前先去危险内容。
                        $(".content .detail").html(sanitizeHtml(html));

                        // 仅作者本人显示"编辑/删除"按钮：
                        // 当前登录用户 id 与博客作者 id 一致时才展示（后端另有权限校验兜底）
                        var loginUserId = sessionStorage.getItem("loginUserId");
                        if (loginUserId && String(loginUserId) === String(result.data.userId)) {
                            $(".content .operating").show();
                        }

                        // 正文区展示作者；左侧卡片展示当前登录用户
                        loadAuthorInfo(blogId);
                        loadLoginUserInfo();
                    } else {
                        alert(result && result.errMsg ? result.errMsg : "未找到博客详情");
                    }
                },
                error: function () {
                    alert("加载博客详情失败，请稍后重试");
                }
            });
        }

        // 正文区展示博客作者（读者视角：这篇文章是谁写的）
        function loadAuthorInfo(blogId) {
            $.ajax({
                type: "get",
                url: "/user/getAuthorInfo",
                data: { blogId: blogId },
                success: function (result) {
                    if (result && result.code === 200 && result.data) {
                        $(".content .author").text("作者：" + (result.data.userName || "未知作者"));
                    }
                }
            });
        }

        // 左侧卡片展示"当前登录用户"的信息（与列表页保持一致；作者信息已在正文区展示，不重复）
        function loadLoginUserInfo() {
            var userId = sessionStorage.getItem("loginUserId");
            if (!userId) return;
            $.ajax({
                type: "get",
                url: "/user/getUserInfo",
                data: { userId: userId },
                success: function (result) {
                    if (result && result.code === 200 && result.data) {
                        var userInfo = result.data;
                        $(".container .left .card h3").text(userInfo.userName || "");
                        if (userInfo.githubUrl) {
                            $(".container .left .card a").attr("href", userInfo.githubUrl).text("GitHub").attr("target", "_blank");
                        } else {
                            $(".container .left .card a").attr("href", "#").text("📝 完善个人主页").css("color", "#bbb");
                        }
                        if (typeof userInfo.blogCount === "number") {
                            $("#user-blog-count").text(userInfo.blogCount);
                        }
                    }
                }
            });
        }

        // 跳转到更新页面
        function toUpdate() {
            if (!blogId) return;
            window.location.href = "blog_update.html?blogId=" + blogId;
        }

        function deleteBlog() {
            if (!blogId) return;
            if (!confirm("确定删除这篇博客吗？")) return;
            $.ajax({
                type: "post",
                url: "/blog/delete",
                data: { blogId: blogId },
                success: function (result) {
                    if (result && result.code === 200) {
                        location.href = "blog_list.html";
                    } else {
                        alert(result && result.errMsg ? result.errMsg : "删除失败");
                    }
                },
                error: function () {
                    alert("删除失败，请稍后重试");
                }
            });
        }
    </script>
</body>

</html>
