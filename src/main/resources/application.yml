server:
  port: 8080

blog:
  jwt:
    # JWT 签名密钥（Base64 编码的 HMAC-SHA 密钥）
    # 生产环境务必通过环境变量 BLOG_JWT_SECRET 覆盖，不要使用默认值
    secret: ${BLOG_JWT_SECRET:dVnsmy+SIX6pNptQdeclDSJ26EMSPEIhvZYKBTTug4k=}
    # token 过期时间（毫秒），默认 24 小时
    expiration: 86400000

spring:
  profiles:
    active: "@profile.name@"

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/java_blog_spring?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-test-query: SELECT 1
      validation-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  file:
    name: spring-blog-dev.log
