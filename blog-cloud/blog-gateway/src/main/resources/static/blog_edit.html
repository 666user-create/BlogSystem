<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客编辑页</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/edit.css">
    <link rel="stylesheet" href="blog-editormd/css/editormd.css" />

</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="">
        <span class="blog-title">我的博客系统</span>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_edit.html">写博客</a>
        <a class="nav-span nav-admin" href="blog_admin.html">管理</a>
        <a class="nav-span" href="#" onclick="logout()">注销</a>
    </div>
    <div class="content-edit">
        <div class="push">
            <input type="text" name="" id="title">
            <input type="button" value="发布文章" id="submit" onclick="submit()">
        </div>
        <!-- markdown 插件 html代码 -->
        <div id="editor">
            <textarea style="display:none;" id="content" name="content">##在这里写下一篇博客</textarea>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="blog-editormd/editormd.min.js"></script>
    <script src="js/common.js"></script>
    <script type="text/javascript">

        $(function () {
            var editor = editormd("editor", {
                width: "100%",
                height: "550px",
                path: "blog-editormd/lib/"
            });
            // 将 editor 实例挂到全局，方便提交时取内容
            window.editor = editor;
        });

        function submit() {
            var title = $("#title").val().trim();
            var content = window.editor ? window.editor.getMarkdown() : $("#content").val();
            if (!title) {
                alert("标题不能为空");
                return;
            }
            if (!content) {
                alert("内容不能为空");
                return;
            }

            $.ajax({
                type: "post",
                url: "/blog/add",
                contentType: "application/json",
                data: JSON.stringify({
                    title: title,
                    content: content
                }),
                success: function (result) {
                    if (result && result.code === 200) {
                        alert("发表成功");
                        window.location.href = "blog_list.html";
                    } else if (result && result.errMsg) {
                        alert(result.errMsg);
                    } else {
                        alert("发表失败");
                    }
                },
                error: function () {
                    alert("发表失败，请稍后重试");
                }
            });
        }
    </script>
</body>

</html>
