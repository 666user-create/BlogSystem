<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客编辑页</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/edit.css">
    <link rel="stylesheet" href="blog-editormd/css/editormd.css" />

</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="">
        <span class="blog-title">我的博客系统</span>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_edit.html">写博客</a>
        <a class="nav-span nav-admin" href="blog_admin.html">管理</a>
        <a class="nav-span" href="#" onclick="logout()">注销</a>
    </div>
    <div class="content-edit">
        <div class="push">
            <input type="hidden" id="blogId">
            <input type="text" name="" id="title">
            <input type="button" value="更新文章" id="submit" onclick="submit()">
        </div>
        <!-- markdown 插件 html代码 -->
        <div id="editor">
            <textarea style="display:none;" id="content">##在这里写下一篇博客</textarea>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="blog-editormd/editormd.min.js"></script>
    <script src="js/common.js"></script>
    <script type="text/javascript">

        // 初始化编辑器
        $(function () {
            var editor = editormd("editor", {
                width  : "100%",
                height : "550px",
                path: "blog-editormd/lib/"
            });
            // 挂到全局，提交时可以取内容
            window.editor = editor;
        });
        
        // 提交更新
        function submit() {
            var blogId = $("#blogId").val();
            var title = $("#title").val().trim();
            var content = window.editor ? window.editor.getMarkdown() : $("#content").val();

            if (!blogId) {
                alert("缺少博客ID，无法更新");
                return;
            }
            if (!title) {
                alert("标题不能为空");
                return;
            }
            if (!content) {
                alert("内容不能为空");
                return;
            }

            $.ajax({
                type: "post",
                url: "/blog/update",
                contentType: "application/json",
                data: JSON.stringify({
                    id: blogId,
                    title: title,
                    content: content
                }),
                success: function (result) {
                    if (result && result.code === 200) {
                        alert("更新成功");
                        window.location.href = "blog_detail.html?blogId=" + blogId;
                    } else if (result && result.errMsg) {
                        alert(result.errMsg);
                    } else {
                        alert("更新失败");
                    }
                },
                error: function () {
                    alert("更新失败，请稍后重试");
                }
            });
        }

        // 根据 URL 中的 blogId 加载博客信息
        function getBlogInfo() {
            var params = new URLSearchParams(location.search);
            var blogId = params.get("blogId");
            if (!blogId) {
                alert("缺少博客ID");
                return;
            }
            $("#blogId").val(blogId);

            $.ajax({
                type: "get",
                url: "/blog/getBlogDetail",
                data: { blogId: blogId },
                success: function (result) {
                    if (result && result.code === 200 && result.data) {
                        $("#title").val(result.data.title || "");
                        if (window.editor) {
                            window.editor.setMarkdown(result.data.content || "");
                        } else {
                            $("#content").val(result.data.content || "");
                        }
                    } else {
                        alert(result && result.errMsg ? result.errMsg : "未找到博客信息");
                    }
                },
                error: function () {
                    alert("加载博客信息失败，请稍后重试");
                }
            });
        }

        // 页面加载后拉取当前博客信息
        getBlogInfo();
    </script>
</body>

</html>
