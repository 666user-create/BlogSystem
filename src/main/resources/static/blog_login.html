<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客登陆页</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="">
        <span class="blog-title">我的博客系统</span>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_register.html">注册</a>
    </div>

    <div class="container-login">
        <div class="login-dialog">
            <h3>登陆</h3>
            <div class="row">
                <span>用户名</span>
                <input type="text" name="username" id="username">
            </div>
            <div class="row">
                <span>密码</span>
                <input type="password" name="password" id="password">
            </div>
            <div class="row">
                <button id="submit" onclick="login()">提交</button>
            </div>
            <div class="row tip">
                <span>没有账号？<a href="blog_register.html">去注册</a></span>
            </div>

        </div>
    </div>
    <script src="js/jquery.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        function login() {
            var username = $("#username").val().trim();
            var password = $("#password").val().trim();
            if (!username || !password) {
                alert("用户名和密码不能为空");
                return;
            }
            $.ajax({
                type: "post",
                url: "/user/login",
                contentType: "application/json",
                data: JSON.stringify({
                    userName: username,
                    password: password
                }),
                success: function (result) {
                    if (result && result.code === 200 && result.data) {
                        sessionStorage.clear();
                        sessionStorage.setItem("loginUserId", result.data.userId);
                        sessionStorage.setItem("user_token", result.data.token);
                        sessionStorage.setItem("userToken", result.data.token);
                        sessionStorage.setItem("userName", result.data.userName || "");
                        location.href = "blog_list.html";
                    } else {
                        alert(result && result.errMsg ? result.errMsg : "用户名或密码错误");
                    }
                },
                error: function () {
                    alert("登录失败，请稍后重试");
                }
            })
        }
    </script>
</body>

</html>
